name: Bug report / 不具合報告
description: Something isn't working / 何かがうまく動かない
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! / 報告ありがとうございます。
        Please do **not** use this template to request features that share location
        before both people have explicitly approved, or that expand who can see
        someone's location. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 何が起きましたか？
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期待する動作
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / 再現手順
      description: Include whether this happened in `npm run dev` (local) or a real deploy.
      placeholder: |
        1. `npm run dev`
        2. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 環境
      placeholder: "macOS 15 / Node 22 / Chrome 130, etc."
    validations:
      required: false
