name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/geo.js
          node --check src/floors.js
          node --check src/room.js
          node --check src/jev.js
          node --check src/room-do.js
          node --check src/html.js
          node --check src/lp.js
          node --check src/constants.js
          node --check src/security-headers.js
          node --check src/app-origin.js
          node --check src/legal.js
          node --check public/assets/js/app.js
          node --check public/assets/js/ar.js
          node --check public/assets/js/vr.js
          node --check public/assets/js/geo.js
          node --check public/assets/js/shibuya3d.mjs
          node --check public/assets/js/shibuya3d-hq.mjs
          node --check public/assets/js/route.js
          node --check public/assets/js/route-panel.js
          node --check ../scripts/build_route_graph.mjs
      - name: Unit tests (room state machine / geo / floors / jev / walking directions)
        run: npm test
      - name: iOS app shell (app/ - bundled index.html builder, native bridge, demo mode)
        run: |
          node --check ../app/src/native-bridge.js
          node --check ../app/src/demo.js
          node --check ../app/scripts/build-www.mjs
          node --test ../app/test/*.test.mjs
