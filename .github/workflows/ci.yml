name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: |
          node --check src/index.js
          node --check src/geo.js
          node --check src/floors.js
          node --check src/room.js
          node --check src/jev.js
          node --check src/room-do.js
          node --check src/html.js
          node --check src/lp.js
          node --check src/constants.js
          node --check src/security-headers.js
          node --check public/assets/js/app.js
          node --check public/assets/js/ar.js
          node --check public/assets/js/vr.js
          node --check public/assets/js/geo.js
          node --check public/assets/js/shibuya3d.mjs
      - name: Unit tests (room state machine / geo / floors / jev)
        run: npm test
