name: shibuya_machimachi
description: "渋谷マチマチ（Flutter版）: 渋谷駅から半径1.5km限定の1対1待ち合わせアプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# 版は全部固定（^ を付けない）。上げるときは統合担当が SPEC.md §4 と一緒に更新する。
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.9
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  http: 1.6.0
  geolocator: 14.1.0
  flutter_compass: 0.8.1
  sensors_plus: 7.1.0
  camera: 0.12.1
  permission_handler: 13.0.2
  maplibre_gl: 0.27.1
  flutter_inappwebview: 6.1.5
  flutter_secure_storage: 11.2.0
  share_plus: 13.3.0
  url_launcher: 6.3.2
  app_links: 7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # シミュレータ／実機での画面確認（integration_test/ と test_driver/）。
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    # 共有データ（worker/public からの写し。出典は assets/ATTRIBUTION.md）
    - assets/ATTRIBUTION.md
    - assets/data/buildings_shibuya_1500m.geojson
    - assets/data/pois_shibuya_1500m.geojson
    - assets/route/graph.json
    - assets/route/places.json
    # 高画質3D（map3d 担当が WebView 用の HTML/JS/wasm をここに置く）
    - assets/hq/
