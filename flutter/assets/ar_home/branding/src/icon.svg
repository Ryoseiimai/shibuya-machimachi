<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 渋谷マチマチ（Flutter 版）アプリアイコン（自作）。Capacitor 版（app/resources/icon.svg）と同じ
       ブランドのオレンジ #c8431f の地に、「相手の方角を指す矢印」と、AR で出す「人影」を輪の中に置いた。
       文字・写真・第三者素材は不使用。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9552c"/>
      <stop offset="1" stop-color="#b8391a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ring"><circle cx="690" cy="334" r="138"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- 待ち合わせ相手: 右上の輪と人影（AR の人影と同じ形：頭の円＋肩） -->
    <g transform="translate(712 312) scale(0.88) translate(-690 -334)">
  <circle cx="690" cy="334" r="138" fill="#ffe6db" fill-opacity="0.18" stroke="#ffe6db" stroke-width="22"/>
  <g clip-path="url(#ring)" fill="#ffe6db">
    <circle cx="690" cy="296" r="50"/>
    <path d="M690 360 C620 360 590 400 590 460 L590 520 L790 520 L790 460 C790 400 760 360 690 360 Z"/>
  </g>
    </g>
  <!-- 自分: 相手の方角（右上）を指す矢印 -->
  <g transform="translate(374 650) rotate(45)">
    <path d="M0 -250 L150 150 L0 70 L-150 150 Z" fill="#ffffff" stroke="#ffffff" stroke-width="24" stroke-linejoin="round"/>
  </g>
</svg>
