<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!--
  外への通信は PLATEAU の配信元(https://assets.cms.plateau.reearth.io)だけに絞る。
  'self' は iOS ではカスタムスキーム machimachi-hq://app、Android では https://appassets.androidplatform.net。
  'unsafe-eval' は iOS 15(WebKit 15)が 'wasm-unsafe-eval' を知らず、draco の WebAssembly を止めてしまうため
  (同梱のファイルしか動かさない画面なので許容。WebKit 16 以上は 'wasm-unsafe-eval' を見る)。
  style-src 'unsafe-inline' は three.js/ラベルがインライン style を書くため(Web 版の CSP と同じ理由)。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' machimachi-hq:; script-src 'self' machimachi-hq: 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' machimachi-hq: data: blob: https://assets.cms.plateau.reearth.io; connect-src 'self' machimachi-hq: data: blob: https://assets.cms.plateau.reearth.io; worker-src 'self' machimachi-hq: blob:; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>高画質3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1114; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #hq-mount { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="hq-mount"></div>
<script type="module" src="./hq-bridge.js"></script>
</body>
</html>
